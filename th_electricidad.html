<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Inspección Tableros Hospitalarios - Maternidad Edif. B</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .tab-active { background-color: #0d9488 !important; color: #ffffff !important; font-weight: 700; }
    select, input, textarea { background-color: #1e293b !important; color: #f8fafc !important; border-color: #334155 !important; }
    select:focus, input:focus, textarea:focus { border-color: #0d9488 !important; outline: none; }
  </style>
</head>
<body class="min-h-screen pb-12 selection:bg-teal-500 selection:text-white">

  <!-- HEADER -->
  <header class="bg-[#0f172a] border-b border-slate-800 sticky top-0 z-50 shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="volverInicio()">
        <div class="bg-teal-500/20 p-2 rounded-xl border border-teal-500/30">
          <i class="fa-solid fa-shield-halved text-teal-400 text-xl"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-sm sm:text-base leading-none text-white uppercase">TH MATERNIDAD</h1>
          <p class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase mt-0.5">Edificio B · Electromedicina</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="cambiarVista('historial')" id="btn-historial" class="bg-[#1e293b] hover:bg-slate-800 text-slate-200 text-xs px-3 py-2 rounded-xl border border-slate-700 font-medium flex items-center space-x-1.5 transition-all">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span>Historial</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6">
    <!-- CONTENEDOR DINÁMICO -->
    <div id="app-container"></div>
  </main>

  <script>
    const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypcOJsdakwguuqlaRm4cgTnmvp0DentOUwoMSLSEjCVAx_WTov2j8SW4dr_8pQUrxmTA/exec';
    const WHATSAPP_TARGET_NUMBER = '5492616505569';

    const ROOMS = [
      { id: 'sala-1-neo', name: 'Sala 1 - Neo - TH', panels: ['#12', '#13', '#14', '#15', '#16'], desc: 'Neonatología Sala 1 - 5 Tableros' },
      { id: 'sala-2-neo', name: 'Sala 2 - Neo - TH', panels: ['#20', '#21', '#22', '#23', '#24'], desc: 'Neonatología Sala 2 - 5 Tableros' },
      { id: 'partos-terapia', name: 'Partos/Terapia - TH', panels: ['#01', '#02', '#03', '#04', '#05', '#06', '#10', '#11'], desc: 'Centro obstétrico y Terapia - 8 Tableros' },
      { id: 'sala-int-neo', name: 'Sala Int. Neo - TH', panels: ['#07', '#08', '#09'], desc: 'Internación Neonatológica - 3 Tableros' },
      { id: 'sala-utpr', name: 'Sala UTPR - TH', panels: ['#17', '#18'], desc: 'Unidad de Trabajo de Parto y Recuperación - 2 Tableros' }
    ];

    const OPERATORS = [
      'Murillo José Luis', 'Novicov Federico', 'Cabañas Gustavo', 'Condorí Lucas',
      'Bejarano Diego', 'Landa Alejandro', 'Gimenez Andres', 'Fernandes Yair',
      'Sinatra Matías', 'Olmedo Orlando', 'Soria Carlos', 'Masman Diego'
    ];

    let estadoApp = {
      vista: 'salas', // 'salas', 'intervencion', 'historial'
      salaActual: null,
      modo: 'checklist', // 'emergencia', 'checklist', 'control'
      operariosSeleccionados: [],
      datosFormulario: {}
    };

    function renderizar() {
      const container = document.getElementById('app-container');
      if (!container) return;

      if (estadoApp.vista === 'salas') {
        container.innerHTML = `
          <div class="space-y-6">
            <div class="bg-gradient-to-r from-slate-900 via-teal-950 to-slate-900 rounded-3xl p-6 text-white border border-teal-900/40 shadow-xl">
              <span class="text-teal-400 text-xs font-bold uppercase tracking-wider">Edificio "B" Maternidad · Seguridad Eléctrica</span>
              <h2 class="text-2xl font-extrabold mt-1">Inspección Operativa de Tableros</h2>
              <p class="text-xs text-slate-300 mt-2">Seleccione una sala para realizar el Check List, Control de Monitor o reporte de Emergencia.</p>
              <div class="mt-4 pt-4 border-t border-teal-900/50 flex justify-between items-center">
                <span class="text-xs text-amber-300">¿Alerta de emergencia en UTPR?</span>
                <button onclick="seleccionarEmergenciaUptr()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs px-3.5 py-2 rounded-xl font-bold flex items-center gap-1.5 shadow-md">
                  <i class="fa-solid fa-triangle-exclamation"></i> Emergencia UTPR
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${ROOMS.map(r => `
                <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start">
                      <h3 class="font-bold text-white text-base">${r.name}</h3>
                      <span class="text-xs font-mono bg-slate-800 text-teal-400 px-2 py-0.5 rounded">${r.panels.length} TH</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-2">${r.desc}</p>
                    <div class="mt-4 flex flex-wrap gap-1">
                      ${r.panels.map(p => `<span class="text-[10px] font-mono bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700">TH ${p}</span>`).join('')}
                    </div>
                  </div>
                  <button onclick="seleccionarSala('${r.id}')" class="mt-5 w-full bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs py-2.5 rounded-xl shadow transition flex items-center justify-center gap-2">
                    <span>Intervenir Sala</span> <i class="fa-solid fa-arrow-right"></i>
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (estadoApp.vista === 'intervencion') {
        const sala = estadoApp.salaActual;
        container.innerHTML = `
          <div class="space-y-6">
            <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 shadow-xl">
              <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <div class="flex items-center gap-3">
                  <button onclick="volverInicio()" class="p-2 bg-slate-800 text-slate-300 rounded-xl text-xs"><i class="fa-solid fa-arrow-left"></i></button>
                  <div>
                    <span class="text-[10px] font-mono text-teal-400 uppercase">Sector Seleccionado</span>
                    <h2 class="text-lg font-bold text-white">${sala.name}</h2>
                  </div>
                </div>
                <span class="text-xs font-mono text-slate-400">${new Date().toLocaleDateString()}</span>
              </div>

              <!-- Selector de Modo -->
              <div class="mt-4 grid grid-cols-3 gap-2">
                <button onclick="cambiarModo('emergencia')" class="p-3 rounded-xl border text-center transition ${estadoApp.modo === 'emergencia' ? 'bg-rose-950/60 border-rose-500 text-white font-bold' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                  <i class="fa-solid fa-triangle-exclamation text-rose-500 block mb-1"></i>
                  <span class="text-xs">Emergencia</span>
                </button>
                <button onclick="cambiarModo('checklist')" class="p-3 rounded-xl border text-center transition ${estadoApp.modo === 'checklist' ? 'bg-teal-950/60 border-teal-500 text-white font-bold' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                  <i class="fa-solid fa-list-check text-teal-400 block mb-1"></i>
                  <span class="text-xs">Check List</span>
                </button>
                <button onclick="cambiarModo('control')" class="p-3 rounded-xl border text-center transition ${estadoApp.modo === 'control' ? 'bg-blue-950/60 border-blue-500 text-white font-bold' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                  <i class="fa-solid fa-gauge text-blue-400 block mb-1"></i>
                  <span class="text-xs">Control</span>
                </button>
              </div>
            </div>

            <!-- FORMULARIO ACTIVO -->
            <div class="bg-[#111827] border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5">
              ${renderizarFormularioModo()}
            </div>
          </div>
        `;
      } else if (estadoApp.vista === 'historial') {
        const guardados = JSON.parse(localStorage.getItem('th_historial_v3') || '[]');
        container.innerHTML = `
          <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
              <h2 class="text-white font-bold text-base"><i class="fa-solid fa-clock-rotate-left text-teal-400"></i> Historial de Registros</h2>
              <button onclick="volverInicio()" class="bg-teal-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Volver</button>
            </div>
            ${guardados.length === 0 ? '<p class="text-xs text-slate-500 text-center py-8">No hay registros guardados en este dispositivo.</p>' : 
              guardados.map(item => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-xs space-y-1">
                  <div class="flex justify-between font-bold text-white">
                    <span>${item.sala} (${item.modo})</span>
                    <span class="text-teal-400">${item.fecha} ${item.hora}</span>
                  </div>
                  <p class="text-slate-300"><strong>Operarios:</strong> ${item.operarios}</p>
                  <p class="text-slate-400"><strong>Estado:</strong> ${item.estado}</p>
                </div>
              `).join('')}
          </div>
        `;
      }
    }

    function renderizarFormularioModo() {
      const sala = estadoApp.salaActual;
      if (estadoApp.modo === 'emergencia') {
        return `
          <div class="space-y-4">
            <div class="bg-rose-950/40 border border-rose-500/50 p-4 rounded-xl text-rose-200 text-xs">
              <span class="font-bold block mb-1">🚨 Protocolo de Emergencia / Alarma Sonora</span>
              Seleccione el tablero afectado y complete las verificaciones obligatorias. Al enviar, se guardará en la planilla y abrirá WhatsApp automáticamente.
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-2">Tablero Afectado:</label>
              <select id="em-tablero" class="w-full text-xs rounded-xl p-3 font-semibold border">
                ${sala.panels.map(p => `<option value="${p}">TH ${p}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-2">Observaciones / Falla:</label>
              <textarea id="em-obs" rows="3" placeholder="Detalle de equipo defectuoso o estado del transformador..." class="w-full text-xs rounded-xl p-3 border"></textarea>
            </div>
            ${renderSeccionOperariosHtml()}
            <button onclick="enviarEmergencia()" class="w-full py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow-lg">
              Enviar Emergencia y Notificar WhatsApp
            </button>
          </div>
        `;
      } else {
        return `
          <div class="space-y-4">
            <div class="bg-teal-950/40 border border-teal-500/50 p-4 rounded-xl text-teal-200 text-xs">
              <span class="font-bold block mb-1">📋 Check List / Control de Sala</span>
              Se registrará la inspección completa para los ${sala.panels.length} tableros de ${sala.name}.
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-2">Estado General de los Tableros:</label>
              <select id="chk-estado" class="w-full text-xs rounded-xl p-3 font-semibold border">
                <option value="Funcionando OK">🟢 Todos Funcionando OK</option>
                <option value="Con Alerta Leve">🟡 Con Alerta Leve</option>
                <option value="Fuera de Servicio">🔴 Fuera de Servicio</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-300 mb-2">Observaciones Generales:</label>
              <textarea id="chk-obs" rows="3" placeholder="Estado de selectores, luces y valores de display..." class="w-full text-xs rounded-xl p-3 border"></textarea>
            </div>
            ${renderSeccionOperariosHtml()}
            <button onclick="enviarChecklist()" class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 text-white font-bold rounded-xl text-xs shadow-lg">
              Finalizar y Guardar en Planilla
            </button>
          </div>
        `;
      }
    }

    function renderSeccionOperariosHtml() {
      return `
        <div class="pt-3 border-t border-slate-800">
          <label class="block text-xs font-bold text-slate-300 mb-2">Seleccione Operarios Intervinientes:</label>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-40 overflow-y-auto p-1">
            ${OPERATORS.map(op => `
              <label class="flex items-center space-x-2 bg-slate-900 p-2 rounded-xl border border-slate-800 text-xs cursor-pointer">
                <input type="checkbox" value="${op}" class="op-checkbox rounded text-teal-500" ${estadoApp.operariosSeleccionados.includes(op) ? 'checked' : ''} onchange="actualizarOperarios()">
                <span class="truncate text-slate-200">${op}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `;
    }

    function actualizarOperarios() {
      const checks = document.querySelectorAll('.op-checkbox:checked');
      estadoApp.operariosSeleccionados = Array.from(checks).map(c => c.value);
    }

    function seleccionarSala(id) {
      estadoApp.salaActual = ROOMS.find(r => r.id === id);
      estadoApp.vista = 'intervencion';
      renderizar();
    }

    function seleccionarEmergenciaUptr() {
      estadoApp.salaActual = ROOMS.find(r => r.id === 'sala-utpr');
      estadoApp.modo = 'emergencia';
      estadoApp.vista = 'intervencion';
      renderizar();
    }

    function cambiarModo(m) {
      estadoApp.modo = m;
      renderizar();
    }

    function volverInicio() {
      estadoApp.vista = 'salas';
      estadoApp.salaActual = null;
      renderizar();
    }

    function cambiarVista(v) {
      estadoApp.vista = v;
      renderizar();
    }

    async function enviarEmergencia() {
      actualizarOperarios();
      if (estadoApp.operariosSeleccionados.length === 0) {
        alert('Por favor seleccione al menos un operario.');
        return;
      }
      const panel = document.getElementById('em-tablero').value;
      const obs = document.getElementById('em-obs').value || 'Sin observaciones';
      const fecha = new Date().toISOString().slice(0, 10);
      const hora = new Date().toLocaleTimeString();

      const payload = {
        tipo_inspeccion: 'Emergencia/Alarma',
        fecha,
        hora,
        sala: estadoApp.salaActual.name,
        tablero_afectado: `TH ${panel}`,
        observaciones: obs,
        operarios: estadoApp.operariosSeleccionados.join(', ')
      };

      try {
        await fetch(GOOGLE_APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        alert('¡Emergencia registrada y fila pintada de rojo en Google Sheets!');
        
        const historial = JSON.parse(localStorage.getItem('th_historial_v3') || '[]');
        historial.unshift({ sala: estadoApp.salaActual.name, modo: 'Emergencia', fecha, hora, operarios: payload.operarios, estado: 'Alerta / Emergencia' });
        localStorage.setItem('th_historial_v3', JSON.stringify(historial));

        const msg = `🚨 *EMERGENCIA TH MATERNIDAD*\n📍 Sala: ${estadoApp.salaActual.name}\n⚡ Tablero: TH ${panel}\n👷 Técnicos: ${payload.operarios}\n📝 Obs: ${obs}`;
        window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP_TARGET_NUMBER}&text=${encodeURIComponent(msg)}`, '_blank');

        volverInicio();
      } catch (e) {
        alert('Error al enviar al servidor.');
      }
    }

    async function enviarChecklist() {
      actualizarOperarios();
      if (estadoApp.operariosSeleccionados.length === 0) {
        alert('Por favor seleccione al menos un operario.');
        return;
      }
      const estado = document.getElementById('chk-estado').value;
      const obs = document.getElementById('chk-obs').value || 'Inspección completada';
      const fecha = new Date().toISOString().slice(0, 10);
      const hora = new Date().toLocaleTimeString();

      const payload = {
        tipo_inspeccion: 'Check List',
        fecha,
        hora,
        sala: estadoApp.salaActual.name,
        tablero_afectado: 'Todos (' + estadoApp.salaActual.panels.join(', ') + ')',
        observaciones: obs,
        operarios: estadoApp.operariosSeleccionados.join(', ')
      };

      try {
        await fetch(GOOGLE_APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        alert('¡Registro sincronizado con éxito en Google Sheets!');

        const historial = JSON.parse(localStorage.getItem('th_historial_v3') || '[]');
        historial.unshift({ sala: estadoApp.salaActual.name, modo: 'Check List', fecha, hora, operarios: payload.operarios, estado });
        localStorage.setItem('th_historial_v3', JSON.stringify(historial));

        volverInicio();
      } catch (e) {
        alert('Error al sincronizar.');
      }
    }

    window.onload = () => renderizar();
  </script>
</body>
</html>
