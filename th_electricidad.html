<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Inspección Tableros Hospitalarios - Maternidad Edif. B</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .tab-active { background-color: #0d9488 !important; color: #ffffff !important; font-weight: 700; }
    select, input, textarea { background-color: #1e293b !important; color: #f8fafc !important; border-color: #334155 !important; }
    select:focus, input:focus, textarea:focus { border-color: #0d9488 !important; outline: none; }
  </style>
</head>
<body class="min-h-screen pb-12 selection:bg-teal-500 selection:text-white">

  <!-- HEADER -->
  <header class="bg-[#0f172a] border-b border-slate-800 sticky top-0 z-50 shadow-lg">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="volverInicio()">
        <div class="bg-teal-500/20 p-2 rounded-xl border border-teal-500/30">
          <i class="fa-solid fa-shield-halved text-teal-400 text-xl"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-sm sm:text-base leading-none text-white uppercase">TH MATERNIDAD</h1>
          <p class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase mt-0.5">Edificio B · Electromedicina</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="cambiarVista('historial')" class="bg-[#1e293b] hover:bg-slate-800 text-slate-200 text-xs px-3 py-2 rounded-xl border border-slate-700 font-medium flex items-center space-x-1.5">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span>Historial</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">
    <div id="app-container"></div>
  </main>

  <script>
    const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypcOJsdakwguuqlaRm4cgTnmvp0DentOUwoMSLSEjCVAx_WTov2j8SW4dr_8pQUrxmTA/exec';
    const WHATSAPP_TARGET_NUMBER = '5492616505569';

    const ROOMS = [
      { id: 'sala-1-neo', name: 'Sala 1 - Neo - TH', panels: ['#12', '#13', '#14', '#15', '#16'], desc: 'Neonatología Sala 1 - 5 Tableros' },
      { id: 'sala-2-neo', name: 'Sala 2 - Neo - TH', panels: ['#20', '#21', '#22', '#23', '#24'], desc: 'Neonatología Sala 2 - 5 Tableros' },
      { id: 'partos-terapia', name: 'Partos/Terapia - TH', panels: ['#01', '#02', '#03', '#04', '#05', '#06', '#10', '#11'], desc: 'Centro obstétrico y Terapia - 8 Tableros' },
      { id: 'sala-int-neo', name: 'Sala Int. Neo - TH', panels: ['#07', '#08', '#09'], desc: 'Internación Neonatológica - 3 Tableros' },
      { id: 'sala-utpr', name: 'Sala UTPR - TH', panels: ['#17', '#18'], desc: 'Unidad de Trabajo de Parto y Recuperación - 2 Tableros' }
    ];

    const OPERATORS = [
      'Murillo José Luis', 'Novicov Federico', 'Cabañas Gustavo', 'Condorí Lucas',
      'Bejarano Diego', 'Landa Alejandro', 'Gimenez Andres', 'Fernandes Yair',
      'Sinatra Matías', 'Olmedo Orlando', 'Soria Carlos', 'Masman Diego'
    ];

    let estadoApp = {
      vista: 'salas', // 'salas', 'intervencion', 'historial'
      salaActual: null,
      modo: 'checklist', // 'emergencia', 'checklist', 'control'
      panelIndexActual: 0,
      datosPaneles: {},
      operariosSeleccionados: []
    };

    function renderizar() {
      const container = document.getElementById('app-container');
      if (!container) return;

      if (estadoApp.vista === 'salas') {
        container.innerHTML = `
          <div class="space-y-6">
            <div class="bg-gradient-to-r from-slate-900 via-teal-950 to-slate-900 rounded-3xl p-6 text-white border border-teal-900/40 shadow-xl">
              <span class="text-teal-400 text-xs font-bold uppercase tracking-wider">Edificio "B" Maternidad · Seguridad Eléctrica</span>
              <h2 class="text-2xl font-extrabold mt-1">Inspección Operativa de Tableros</h2>
              <p class="text-xs text-slate-300 mt-2">Seleccione una sala para realizar el recorrido secuencial tablero por tablero.</p>
              <div class="mt-4 pt-4 border-t border-teal-900/50 flex justify-between items-center">
                <span class="text-xs text-amber-300">¿Alerta de emergencia en UTPR?</span>
                <button onclick="seleccionarEmergenciaUptr()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs px-3.5 py-2 rounded-xl font-bold flex items-center gap-1.5">
                  <i class="fa-solid fa-triangle-exclamation"></i> Emergencia UTPR
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${ROOMS.map(r => `
                <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 shadow-lg flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start">
                      <h3 class="font-bold text-white text-base">${r.name}</h3>
                      <span class="text-xs font-mono bg-slate-800 text-teal-400 px-2 py-0.5 rounded">${r.panels.length} TH</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-2">${r.desc}</p>
                    <div class="mt-3 flex flex-wrap gap-1">
                      ${r.panels.map(p => `<span class="text-[10px] font-mono bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700">TH ${p}</span>`).join('')}
                    </div>
                  </div>
                  <button onclick="seleccionarSala('${r.id}')" class="mt-5 w-full bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs py-2.5 rounded-xl shadow transition flex items-center justify-center gap-2">
                    <span>Intervenir Sala</span> <i class="fa-solid fa-arrow-right"></i>
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (estadoApp.vista === 'intervencion') {
        const sala = estadoApp.salaActual;
        const panelActual = sala.panels[estadoApp.panelIndexActual];
        const datosPanel = estadoApp.datosPaneles[panelActual] || { estado: 'Funcionando', aislacion: 'SI', selectora: 'Automatica', luces: 'SI', display: 'SAFE', obs: '' };

        container.innerHTML = `
          <div class="space-y-6">
            <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 shadow-xl">
              <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-3">
                  <button onclick="volverInicio()" class="p-2 bg-slate-800 text-slate-300 rounded-xl text-xs"><i class="fa-solid fa-arrow-left"></i></button>
                  <div>
                    <span class="text-[10px] font-mono text-teal-400 uppercase">${sala.name}</span>
                    <h2 class="text-base font-bold text-white">Inspección Tablero TH ${panelActual}</h2>
                  </div>
                </div>
                <span class="text-xs font-mono bg-teal-950 text-teal-300 px-2.5 py-1 rounded-lg border border-teal-800">
                  TH ${estadoApp.panelIndexActual + 1} de ${sala.panels.length}
                </span>
              </div>

              <!-- Selector de Modos -->
              <div class="mt-3 grid grid-cols-3 gap-2">
                <button onclick="cambiarModo('emergencia')" class="p-2.5 rounded-xl border text-center transition ${estadoApp.modo === 'emergencia' ? 'bg-rose-950/80 border-rose-500 text-white font-bold' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                  <i class="fa-solid fa-triangle-exclamation text-rose-500 block mb-1"></i><span class="text-xs">Emergencia</span>
                </button>
                <button onclick="cambiarModo('checklist')" class="p-2.5 rounded-xl border text-center transition ${estadoApp.modo === 'checklist' ? 'bg-teal-950/80 border-teal-500 text-white font-bold' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                  <i class="fa-solid fa-list-check text-teal-400 block mb-1"></i><span class="text-xs">Check List</span>
                </button>
                <button onclick="cambiarModo('control')" class="p-2.5 rounded-xl border text-center transition ${estadoApp.modo === 'control' ? 'bg-blue-950/80 border-blue-500 text-white font-bold' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                  <i class="fa-solid fa-gauge text-blue-400 block mb-1"></i><span class="text-xs">Control</span>
                </button>
              </div>
            </div>

            <!-- CONTENIDO DE FORMULARIO TABLERO POR TABLERO -->
            <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
              ${estadoApp.modo === 'emergencia' ? renderEmergenciaHtml(panelActual) : renderChecklistPanelHtml(panelActual, datosPanel)}

              <!-- BOTONES DE NAVEGACIÓN ENTRE TABLEROS -->
              <div class="pt-4 border-t border-slate-800 flex justify-between items-center gap-3">
                <button onclick="panelAnterior()" ${estadoApp.panelIndexActual === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl border bg-slate-900 text-xs font-semibold disabled:opacity-30">
                  <i class="fa-solid fa-chevron-left mr-1"></i> Anterior TH
                </button>
                
                ${estadoApp.panelIndexActual < sala.panels.length - 1 ? `
                  <button onclick="siguientePanel()" class="px-5 py-2.5 bg-teal-600 hover:bg-teal-500 text-white rounded-xl text-xs font-bold">
                    Siguiente TH <i class="fa-solid fa-chevron-right ml-1"></i>
                  </button>
                ` : `
                  <button onclick="finalizarInspeccion()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-extrabold shadow-lg">
                    <i class="fa-solid fa-check-circle mr-1"></i> Finalizar y Enviar Todo
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      } else if (estadoApp.vista === 'historial') {
        const guardados = JSON.parse(localStorage.getItem('th_historial_v3') || '[]');
        container.innerHTML = `
          <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
              <h2 class="text-white font-bold text-base"><i class="fa-solid fa-clock-rotate-left text-teal-400"></i> Historial de Registros</h2>
              <button onclick="volverInicio()" class="bg-teal-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Volver</button>
            </div>
            ${guardados.length === 0 ? '<p class="text-xs text-slate-500 text-center py-8">No hay registros guardados.</p>' : 
              guardados.map(item => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs space-y-1">
                  <div class="flex justify-between font-bold text-white">
                    <span>${item.sala} (${item.modo})</span>
                    <span class="text-teal-400">${item.fecha}</span>
                  </div>
                  <p class="text-slate-300"><strong>Operarios:</strong> ${item.operarios}</p>
                </div>
              `).join('')}
          </div>
        `;
      }
    }

    function renderChecklistPanelHtml(panel, datos) {
      return `
        <div class="space-y-4 text-xs">
          <div class="p-3 bg-slate-900 border border-slate-800 rounded-xl space-y-3">
            <div class="flex justify-between items-center">
              <span class="font-bold text-white uppercase">Estado Operativo · TH ${panel}</span>
              <select id="input-estado" onchange="guardarDatosPanel('${panel}')" class="p-2 rounded-lg font-bold">
                <option value="Funcionando" ${datos.estado === 'Funcionando' ? 'selected' : ''}>🟢 Funcionando</option>
                <option value="Alerta" ${datos.estado === 'Alerta' ? 'selected' : ''}>🟡 Alerta</option>
                <option value="Fuera de Servicio" ${datos.estado === 'Fuera de Servicio' ? 'selected' : ''}>🔴 Fuera de Servicio</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800">
              <div>
                <label class="block text-slate-400 mb-1">Monitor de Aislación:</label>
                <select id="input-aislacion" onchange="guardarDatosPanel('${panel}')" class="w-full p-2 rounded-lg">
                  <option value="SI" ${datos.aislacion === 'SI' ? 'selected' : ''}>SÍ (Normal)</option>
                  <option value="NO" ${datos.aislacion === 'NO' ? 'selected' : ''}>NO (Alarma)</option>
                </select>
              </div>
              <div>
                <label class="block text-slate-400 mb-1">Posición Selectora:</label>
                <select id="input-selectora" onchange="guardarDatosPanel('${panel}')" class="w-full p-2 rounded-lg">
                  <option value="Automatica" ${datos.selectora === 'Automatica' ? 'selected' : ''}>Automática</option>
                  <option value="Principal" ${datos.selectora === 'Principal' ? 'selected' : ''}>Principal</option>
                  <option value="Alternativa" ${datos.selectora === 'Alternativa' ? 'selected' : ''}>Alternativa</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-slate-400 mb-1">Prueba de Luces:</label>
                <select id="input-luces" onchange="guardarDatosPanel('${panel}')" class="w-full p-2 rounded-lg">
                  <option value="SI" ${datos.luces === 'SI' ? 'selected' : ''}>SÍ</option>
                  <option value="NO" ${datos.luces === 'NO' ? 'selected' : ''}>NO</option>
                </select>
              </div>
              <div>
                <label class="block text-slate-400 mb-1">Valor en Display:</label>
                <input type="text" id="input-display" value="${datos.display}" oninput="guardarDatosPanel('${panel}')" class="w-full p-2 rounded-lg font-mono" placeholder="Ej: SAFE / 230V">
              </div>
            </div>

            <div>
              <label class="block text-slate-400 mb-1">Observaciones Específicas para TH ${panel}:</label>
              <input type="text" id="input-obs" value="${datos.obs}" oninput="guardarDatosPanel('${panel}')" class="w-full p-2 rounded-lg" placeholder="Comentarios del tablero...">
            </div>
          </div>
        </div>
      `;
    }

    function renderEmergenciaHtml(panel) {
      return `
        <div class="space-y-4 text-xs">
          <div class="bg-rose-950/40 border border-rose-500/50 p-3 rounded-xl text-rose-200">
            <strong>🚨 Protocolo de Emergencia Activo para TH ${panel}</strong><br>
            Verifique la presencia de tensión, apertura secuencial de ITM y estado del transformador.
          </div>
          <div>
            <label class="block font-bold text-slate-300 mb-1">Detalle de la Falla / Acciones:</label>
            <textarea id="em-obs" rows="3" class="w-full p-2 rounded-lg" placeholder="Desenchufar equipos defectuosos, verificar alarma..."></textarea>
          </div>
        </div>
      `;
    }

    function guardarDatosPanel(panel) {
      estadoApp.datosPaneles[panel] = {
        estado: document.getElementById('input-estado')?.value || 'Funcionando',
        aislacion: document.getElementById('input-aislacion')?.value || 'SI',
        selectora: document.getElementById('input-selectora')?.value || 'Automatica',
        luces: document.getElementById('input-luces')?.value || 'SI',
        display: document.getElementById('input-display')?.value || 'SAFE',
        obs: document.getElementById('input-obs')?.value || ''
      };
    }

    function siguientePanel() {
      guardarDatosPanel(estadoApp.salaActual.panels[estadoApp.panelIndexActual]);
      if (estadoApp.panelIndexActual < estadoApp.salaActual.panels.length - 1) {
        estadoApp.panelIndexActual++;
        renderizar();
      }
    }

    function panelAnterior() {
      guardarDatosPanel(estadoApp.salaActual.panels[estadoApp.panelIndexActual]);
      if (estadoApp.panelIndexActual > 0) {
        estadoApp.panelIndexActual--;
        renderizar();
      }
    }

    function seleccionarSala(id) {
      estadoApp.salaActual = ROOMS.find(r => r.id === id);
      estadoApp.panelIndexActual = 0;
      estadoApp.datosPaneles = {};
      estadoApp.vista = 'intervencion';
      renderizar();
    }

    function seleccionarEmergenciaUptr() {
      estadoApp.salaActual = ROOMS.find(r => r.id === 'sala-utpr');
      estadoApp.modo = 'emergencia';
      estadoApp.panelIndexActual = 0;
      estadoApp.vista = 'intervencion';
      renderizar();
    }

    function cambiarModo(m) {
      estadoApp.modo = m;
      renderizar();
    }

    function volverInicio() {
      estadoApp.vista = 'salas';
      estadoApp.salaActual = null;
      renderizar();
    }

    function cambiarVista(v) {
      estadoApp.vista = v;
      renderizar();
    }

    async function finalizarInspeccion() {
      guardarDatosPanel(estadoApp.salaActual.panels[estadoApp.panelIndexActual]);
      const fecha = new Date().toISOString().slice(0, 10);
      const hora = new Date().toLocaleTimeString();

      const resumenDetalles = Object.keys(estadoApp.datosPaneles).map(th => {
        const d = estadoApp.datosPaneles[th];
        return `TH ${th} [${d.estado}] - Aislación: ${d.aislacion}, Sel: ${d.selectora}, Display: ${d.display} (${d.obs})`;
      }).join(' | ');

      const payload = {
        tipo_inspeccion: estadoApp.modo === 'emergencia' ? 'Emergencia/Alarma' : 'Check List',
        fecha,
        hora,
        sala: estadoApp.salaActual.name,
        tablero_afectado: 'Secuencia Completa (' + estadoApp.salaActual.panels.join(', ') + ')',
        observaciones: resumenDetalles || 'Inspección secuencial completada',
        operarios: "Murillo José Luis" // Operario predeterminado o firmante
      };

      try {
        await fetch(GOOGLE_APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        alert('¡Inspección de todos los TH sincronizada con éxito en Google Sheets!');

        const historial = JSON.parse(localStorage.getItem('th_historial_v3') || '[]');
        historial.unshift({ sala: estadoApp.salaActual.name, modo: estadoApp.modo, fecha, operarios: payload.operarios });
        localStorage.setItem('th_historial_v3', JSON.stringify(historial));

        volverInicio();
      } catch (e) {
        alert('Error al enviar al servidor.');
      }
    }

    window.onload = () => renderizar();
  </script>
</body>
</html>
