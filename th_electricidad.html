          )}
        </div>
      );
    };

    // APLICACIÓN PRINCIPAL
    function App() {
      const [activeTab, setActiveTab] = useState('inspect'); // 'inspect' | 'history'
      const [selectedRoom, setSelectedRoom] = useState(null);
      const [preferredMode, setPreferredMode] = useState('checklist');
      const [inspections, setInspections] = useState(getStoredInspections());
      const [isDark, setIsDark] = useState(false);

      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDark]);

      const handleDelete = (id) => {
        deleteInspectionFromStorage(id);
        setInspections(getStoredInspections());
      };

      return (
        <div className="min-h-screen flex flex-col transition-colors">
          {/* Header Superior */}
          <header className="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
              <button onClick={() => { setActiveTab('inspect'); setSelectedRoom(null); }} className="flex items-center gap-2.5 text-left group">
                <div className="w-9 h-9 rounded-xl bg-teal-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
                  <Icon name="shield" className="w-5 h-5" />
                </div>
                <div>
                  <span className="font-bold text-base tracking-tight block leading-tight text-slate-900 dark:text-white">TH Maternidad</span>
                  <span className="text-[11px] text-slate-500 block leading-none mt-0.5">Edificio B · Electromedicina</span>
                </div>
              </button>

              <nav className="flex items-center gap-1 sm:gap-2">
                <button
                  onClick={() => { setActiveTab('inspect'); setSelectedRoom(null); }}
                  className={`px-3 py-2 text-xs sm:text-sm font-medium rounded-lg flex items-center gap-1.5 ${activeTab === 'inspect' ? 'bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 font-semibold' : 'text-slate-600 dark:text-slate-300'}`}
                >
                  <Icon name="layers" className="w-4 h-4" />
                  <span>Salas & TH</span>
                </button>
                <button
                  onClick={() => setActiveTab('history')}
                  className={`px-3 py-2 text-xs sm:text-sm font-medium rounded-lg flex items-center gap-1.5 ${activeTab === 'history' ? 'bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 font-semibold' : 'text-slate-600 dark:text-slate-300'}`}
                >
                  <Icon name="history" className="w-4 h-4" />
                  <span>Historial ({inspections.length})</span>
                </button>
              </nav>

              <div className="flex items-center gap-2">
                <button onClick={() => setIsDark(!isDark)} className="p-2 rounded-lg border text-slate-500 hover:text-slate-900 dark:text-slate-400 min-h-[44px] min-w-[44px] flex items-center justify-center">
                  <Icon name={isDark ? "sun" : "moon"} className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {/* Contenido Principal */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 pb-20">
            {activeTab === 'inspect' && (
              <>
                {!selectedRoom ? (
                  <div className="space-y-6">
                    {/* Banner de Inicio */}
                    <div className="bg-gradient-to-r from-slate-900 via-teal-950 to-slate-900 rounded-3xl p-6 sm:p-8 text-white shadow-md border border-teal-900/40">
                      <div className="max-w-2xl">
                        <div className="text-teal-300 text-xs font-semibold tracking-wide uppercase mb-1.5">Edificio "B" Maternidad · Seguridad Eléctrica</div>
                        <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Inspección Operativa de Tableros Hospitalarios</h1>
                        <p className="mt-2 text-sm text-slate-300 leading-relaxed">
                          Seleccione la sala o sector a intervenir para realizar controles de aislación, check list reglamentario o atención de emergencia con alarma.
                        </p>
                      </div>
                      <div className="mt-6 pt-5 border-t border-teal-800/50 flex flex-col sm:flex-row items-center justify-between gap-3">
                        <span className="text-xs text-amber-200">¿Alarma sonora activa en este momento?</span>
                        <button
                          onClick={() => {
                            const utpr = ROOMS.find(r => r.id === 'sala-utpr') || ROOMS[0];
                            setSelectedRoom(utpr);
                            setPreferredMode('emergencia');
                          }}
                          className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5"
                        >
                          <Icon name="alert" className="w-3.5 h-3.5" />
                          <span>Atención Emergencia Sala UTPR (#17 / #18)</span>
                        </button>
                      </div>
                    </div>

                    {/* Grilla de las 5 Salas (Punto F) */}
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 dark:text-white mb-4">Salas Quirúrgicas y Cuidados Críticos (Punto F)</h2>
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
                        {ROOMS.map((r) => (
                          <div key={r.id} className="bg-white dark:bg-slate-900 rounded-2xl border p-5 flex flex-col justify-between hover:shadow-md transition-all">
                            <div>
                              <div className="flex items-start justify-between">
                                <h3 className="text-base font-bold text-slate-900 dark:text-white">{r.name}</h3>
                                <span className="text-xs font-mono font-bold px-2 py-0.5 bg-slate-100 dark:bg-slate-800 rounded">{r.panels.length} TH</span>
                              </div>
                              <p className="text-xs text-slate-500 mt-2">{r.description}</p>
                              <div className="mt-4 pt-3 border-t">
                                <span className="text-[11px] font-medium text-slate-500 block mb-1.5">Secuencia de tableros:</span>
                                <div className="flex flex-wrap gap-1.5">
                                  {r.panels.map(p => (
                                    <span key={p} className="text-xs font-mono font-bold px-2 py-0.5 bg-teal-50 dark:bg-teal-950 text-teal-800 dark:text-teal-300 rounded border border-teal-200">TH {p}</span>
                                  ))}
                                </div>
                                <p className="text-[11px] text-slate-400 mt-2 italic">{r.sequenceNote}</p>
                              </div>
                            </div>
                            <div className="mt-5 pt-3 border-t">
                              <button
                                onClick={() => { setSelectedRoom(r); setPreferredMode('checklist'); }}
                                className="w-full px-4 py-2.5 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 min-h-[44px]"
                              >
                                <span>Intervenir Sala</span>
                                <Icon name="arrow-right" className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                ) : (
                  /* Wizard de Inspección (Puntos A, B, C, D) */
                  <div className="space-y-6">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl border p-5 sm:p-6 shadow-sm">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b">
                        <div className="flex items-center gap-3">
                          <button onClick={() => setSelectedRoom(null)} className="p-2 border rounded-xl text-slate-500 min-h-[44px] min-w-[44px] flex items-center justify-center">
                            <Icon name="arrow-left" className="w-5 h-5" />
                          </button>
                          <div>
                            <span className="text-xs font-mono font-bold text-teal-600 uppercase">Sector en Intervención</span>
                            <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white">{selectedRoom.name}</h1>
                          </div>
                        </div>
                        <div className="flex items-center gap-2 text-xs font-mono bg-slate-50 dark:bg-slate-800 p-2 rounded-xl border">
                          <span>Fecha: {getCurrentDateFormatted()}</span>
                          <span>·</span>
                          <span>Hora: {getCurrentTimeFormatted()}</span>
                        </div>
                      </div>

                      {/* Selector de Modo (Punto A.4) */}
                      <div className="mt-4">
                        <label className="block text-xs font-bold uppercase tracking-wide mb-2">Punto A.4 · Seleccione Procedimiento:</label>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                          <button
                            type="button"
                            onClick={() => setPreferredMode('emergencia')}
                            className={`p-3 rounded-2xl border text-left min-h-[58px] flex items-center gap-3 ${preferredMode === 'emergencia' ? 'bg-rose-50 dark:bg-rose-950/40 border-rose-500 ring-2 ring-rose-400' : 'bg-slate-50 dark:bg-slate-800/40 border-slate-200'}`}
                          >
                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${preferredMode === 'emergencia' ? 'bg-rose-600 text-white' : 'bg-slate-200 dark:bg-slate-700'}`}>
                              <Icon name="alert" className="w-4 h-4" />
                            </div>
                            <div>
                              <span className="text-sm font-bold block">Emergencia / Alarma</span>
                              <span className="text-[11px] text-slate-500 block">Punto B · TH individual</span>
                            </div>
                          </button>

                          <button
                            type="button"
                            onClick={() => setPreferredMode('checklist')}
                            className={`p-3 rounded-2xl border text-left min-h-[58px] flex items-center gap-3 ${preferredMode === 'checklist' ? 'bg-teal-50 dark:bg-teal-950/40 border-teal-500 ring-2 ring-teal-400' : 'bg-slate-50 dark:bg-slate-800/40 border-slate-200'}`}
                          >
                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${preferredMode === 'checklist' ? 'bg-teal-600 text-white' : 'bg-slate-200 dark:bg-slate-700'}`}>
                              <Icon name="layers" className="w-4 h-4" />
                            </div>
                            <div>
                              <span className="text-sm font-bold block">Check List</span>
                              <span className="text-[11px] text-slate-500 block">Punto C · Secuencial</span>
                            </div>
                          </button>

                          <button
                            type="button"
                            onClick={() => setPreferredMode('control')}
                            className={`p-3 rounded-2xl border text-left min-h-[58px] flex items-center gap-3 ${preferredMode === 'control' ? 'bg-blue-50 dark:bg-blue-950/40 border-blue-500 ring-2 ring-blue-400' : 'bg-slate-50 dark:bg-slate-800/40 border-slate-200'}`}
                          >
                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${preferredMode === 'control' ? 'bg-blue-600 text-white' : 'bg-slate-200 dark:bg-slate-700'}`}>
                              <Icon name="gauge" className="w-4 h-4" />
                            </div>
                            <div>
                              <span className="text-sm font-bold block">Control</span>
                              <span className="text-[11px] text-slate-500 block">Punto D · Panel Monitor</span>
                            </div>
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* Sub-formulario correspondiente */}
                    {preferredMode === 'emergencia' && (
                      <EmergencyForm
                        room={selectedRoom}
                        date={getCurrentDateFormatted()}
                        time={getCurrentTimeFormatted()}
                        onCancel={() => setSelectedRoom(null)}
                        onSubmit={() => {
                          setSelectedRoom(null);
                          setInspections(getStoredInspections());
                        }}
                      />
                    )}

                    {preferredMode === 'checklist' && (
                      <ChecklistWizard
                        room={selectedRoom}
                        date={getCurrentDateFormatted()}
                        time={getCurrentTimeFormatted()}
                        onCancel={() => setSelectedRoom(null)}
                        onSubmit={() => {
                          setSelectedRoom(null);
                          setInspections(getStoredInspections());
                        }}
                      />
                    )}

                    {preferredMode === 'control' && (
                      <ControlWizard
                        room={selectedRoom}
                        date={getCurrentDateFormatted()}
                        time={getCurrentTimeFormatted()}
                        onCancel={() => setSelectedRoom(null)}
                        onSubmit={() => {
                          setSelectedRoom(null);
                          setInspections(getStoredInspections());
                        }}
                      />
                    )}
                  </div>
                )}
              </>
            )}

            {/* Pestaña: Historial */}
            {activeTab === 'history' && (
              <div className="space-y-4">
                <div className="bg-white dark:bg-slate-900 rounded-2xl border p-4 sm:p-5 flex items-center justify-between">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900 dark:text-white">Historial de Registros</h2>
                    <p className="text-xs text-slate-500">Total de controles guardados: {inspections.length}</p>
                  </div>
                  <button onClick={() => { setActiveTab('inspect'); setSelectedRoom(null); }} className="px-4 py-2 bg-teal-600 text-white rounded-xl text-xs font-bold">
                    Nueva Inspección
                  </button>
                </div>

                {inspections.length === 0 ? (
                  <div className="text-center py-12 bg-white dark:bg-slate-900 rounded-2xl border p-6 text-slate-500 text-sm">
                    No hay registros en el dispositivo. Realice un control para registrar datos.
                  </div>
                ) : (
                  <div className="space-y-3">
                    {inspections.map((r) => (
                      <div key={r.id} className="bg-white dark:bg-slate-900 rounded-2xl border p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                          <div className="flex items-center gap-2 mb-1">
                            <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded uppercase bg-teal-100 text-teal-800">{r.mode}</span>
                            <span className="text-xs font-mono text-slate-500">{r.date} {r.time}</span>
                            <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700">{r.summaryStatus}</span>
                          </div>
                          <h3 className="font-bold text-base text-slate-900 dark:text-white">{r.roomName}</h3>
                          <span className="text-xs text-slate-500">Operarios: {r.operators.join(', ') || 'No asignado'}</span>
                        </div>
                        <div className="flex items-center gap-2 self-end sm:self-auto">
                          <button 
                            onClick={() => {
                              const txt = formatInspectionForWhatsApp(r);
                              if (r.mode === 'emergencia') {
                                window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP_TARGET_NUMBER}&text=${encodeURIComponent(txt)}`, '_blank');
                              } else {
                                navigator.clipboard.writeText(txt);
                                alert('¡Texto del reporte copiado al portapapeles!');
                              }
                            }} 
                            className="px-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-semibold"
                          >
                            {r.mode === 'emergencia' ? 'Reenviar WhatsApp' : 'Copiar Reporte'}
                          </button>
                          <button onClick={() => { if(confirm('¿Eliminar del historial?')) handleDelete(r.id); }} className="p-2 text-rose-500 hover:bg-rose-50 rounded-xl text-xs">
                            <Icon name="x" className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Pie de Página */}
          <footer className="border-t bg-white/70 dark:bg-slate-900/70 text-slate-500 text-xs py-4 px-4 text-center mt-auto">
            <span>Edificio "B" Maternidad · Departamento de Electromedicina y Mantenimiento</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
